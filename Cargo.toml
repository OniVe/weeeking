[package]
name = "weeeking"
version = "0.1.0"
edition = "2024"
description = "Weeeking — MCP server for Weeek with full public API coverage (generated from the official OpenAPI). Weeek and conquer."
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/OniVe/weeeking"
keywords = ["mcp", "model-context-protocol", "weeek", "weeeking", "tasks"]
categories = ["command-line-utilities"]
readme = "README.md"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "stream"] }
rmcp = { version = "3.5.1", features = ["transport-io"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }

[target."cfg(windows)".dependencies]
keyring = "4.2.0"
