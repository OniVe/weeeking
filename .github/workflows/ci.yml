name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout@v7.0.1 (запиннено по SHA)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Rust stable ставим сами через rustup (он есть на GitHub-hosted образах):
      # сторонняя action не нужна — нечему устаревать и нечего исключать из Dependabot.
      # Микро-ретраи: rustup ходит на сервер релизов, транзиентные сбои загрузки бывают.
      - name: Install Rust (stable)
        shell: bash
        run: |
          command -v rustup >/dev/null || { echo "rustup not found on this runner"; exit 1; }
          attempt=1
          while true; do
            if rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update; then
              break
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "rustup install failed after 3 attempts"; exit 1
            fi
            echo "rustup install failed (attempt $attempt); retry in 20s"
            sleep 20
            attempt=$((attempt + 1))
          done
          rustup default stable
      # Swatinem/rust-cache@v2 (запиннено по SHA)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

  release:
    name: release (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: weeeking-x86_64-pc-windows-msvc.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: weeeking-x86_64-unknown-linux-gnu.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust (stable)
        shell: bash
        run: |
          command -v rustup >/dev/null || { echo "rustup not found on this runner"; exit 1; }
          attempt=1
          while true; do
            if rustup toolchain install stable --profile minimal --no-self-update; then
              break
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "rustup install failed after 3 attempts"; exit 1
            fi
            echo "rustup install failed (attempt $attempt); retry in 20s"
            sleep 20
            attempt=$((attempt + 1))
          done
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Check release preconditions
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match v${version}"; exit 1
          fi
          if [ ! -s .github/release-body.md ]; then
            echo ".github/release-body.md is missing or empty"; exit 1
          fi
      - run: cargo build --release --locked
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/weeeking.exe -DestinationPath ${{ matrix.archive }}
          $hash = (Get-FileHash ${{ matrix.archive }} -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("${{ matrix.archive }}.sha256", "$hash  ${{ matrix.archive }}`n")
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf ${{ matrix.archive }} -C target/release weeeking
          sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
      # softprops/action-gh-release@v3.0.3 (запиннено по SHA)
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          body_path: .github/release-body.md
          files: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
