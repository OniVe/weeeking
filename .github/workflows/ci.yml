name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout@v4 (запиннено по SHA)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain, master (запиннено по SHA из истории master; toolchain задаётся явно)
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Swatinem/rust-cache@v2 (запиннено по SHA)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

  release:
    name: release (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: weeeking-x86_64-pc-windows-msvc.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: weeeking-x86_64-unknown-linux-gnu.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo build --release --locked
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/weeeking.exe -DestinationPath ${{ matrix.archive }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.archive }} -C target/release weeeking
      # softprops/action-gh-release@v2 (запиннено по SHA)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: ${{ matrix.archive }}
