name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout@v7.0.1 (запиннено по SHA)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # LF-инвариант: ни в индексе, ни в рабочем дереве нет CRLF/mixed
      # (*.bat/*.cmd разрешены атрибутами в .gitattributes).
      - name: Check line endings (LF)
        shell: bash
        run: |
          bad=$(git ls-files --eol | grep -E '(i|w)/(crlf|mixed)' | grep -vE '\.(bat|cmd)$' || true)
          if [ -n "$bad" ]; then
            echo "CRLF/mixed files found:"; echo "$bad"; exit 1
          fi
      # Rust stable ставим сами через rustup (он есть на GitHub-hosted образах):
      # сторонняя action не нужна — нечему устаревать и нечего исключать из Dependabot.
      # Микро-ретраи: rustup ходит на сервер релизов, транзиентные сбои загрузки бывают.
      - name: Install Rust (stable)
        shell: bash
        run: |
          command -v rustup >/dev/null || { echo "rustup not found on this runner"; exit 1; }
          attempt=1
          while true; do
            if rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update; then
              break
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "rustup install failed after 3 attempts"; exit 1
            fi
            echo "rustup install failed (attempt $attempt); retry in 20s"
            sleep 20
            attempt=$((attempt + 1))
          done
          rustup default stable
      # Swatinem/rust-cache@v2 (запиннено по SHA)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

  npm:
    name: npm wrapper (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout@v7.0.1 (запиннено по SHA)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node@v7.1.0 (запиннено по SHA; npm >= 11.5.1 — требование OIDC)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Test npm wrapper
        working-directory: npm
        run: node --test

  # Проверочная сборка всех релизных платформ на main (+ dispatch не по тегу):
  # поломки платформ должны ловиться до тега, а не на релизе. PR не гоняем — экономим время.
  build-matrix:
    name: build (${{ matrix.key }})
    if: >-
      (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            key: win-x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            key: win-arm64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            key: linux-x64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            key: linux-musl-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            key: linux-arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            key: osx-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            key: osx-x64
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      CC_x86_64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      # actions/checkout@v7.0.1 (запиннено по SHA)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust (stable)
        shell: bash
        run: |
          command -v rustup >/dev/null || { echo "rustup not found on this runner"; exit 1; }
          attempt=1
          while true; do
            if rustup toolchain install stable --profile minimal --no-self-update; then
              break
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "rustup install failed after 3 attempts"; exit 1
            fi
            echo "rustup install failed (attempt $attempt); retry in 20s"
            sleep 20
            attempt=$((attempt + 1))
          done
          rustup default stable
      - name: Install target and musl toolchain
        shell: bash
        run: |
          rustup target add "${TARGET}"
          if [ "${TARGET}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
          fi
      # Swatinem/rust-cache@v2 (запиннено по SHA)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.key }}
      - name: Build release
        shell: bash
        run: cargo build --release --locked --target "${TARGET}"
      - name: Smoke (--help)
        shell: bash
        run: |
          bin="target/${TARGET}/release/weeeking"
          if [ -f "${bin}.exe" ]; then bin="${bin}.exe"; fi
          "${bin}" --help > /dev/null
      - name: Smoke in Alpine container (musl)
        if: matrix.key == 'linux-musl-x64'
        shell: bash
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}/target/${TARGET}/release:/m:ro" alpine:3.20 /m/weeeking --help > /dev/null

  release:
    name: release (${{ matrix.key }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            key: win-x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            key: win-arm64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            key: linux-x64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            key: linux-musl-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            key: linux-arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            key: osx-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            key: osx-x64
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      CC_x86_64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      # actions/checkout@v7.0.1 (запиннено по SHA)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust (stable)
        shell: bash
        run: |
          command -v rustup >/dev/null || { echo "rustup not found on this runner"; exit 1; }
          attempt=1
          while true; do
            if rustup toolchain install stable --profile minimal --no-self-update; then
              break
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "rustup install failed after 3 attempts"; exit 1
            fi
            echo "rustup install failed (attempt $attempt); retry in 20s"
            sleep 20
            attempt=$((attempt + 1))
          done
          rustup default stable
      - name: Install target and musl toolchain
        shell: bash
        run: |
          rustup target add "${TARGET}"
          if [ "${TARGET}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
          fi
      # Swatinem/rust-cache@v2 (запиннено по SHA)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.key }}
      - name: Check release preconditions
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match v${version}"; exit 1
          fi
          if [ ! -s .github/release-body.md ]; then
            echo ".github/release-body.md is missing or empty"; exit 1
          fi
          if ! grep -qF "[${version}]" .github/release-body.md; then
            echo ".github/release-body.md does not mention [${version}]"; exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Build release
        shell: bash
        run: cargo build --release --locked --target "${TARGET}"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:VERSION
          $archive = "weeeking-$version-${{ matrix.key }}.zip"
          $raw = "weeeking-$version-${{ matrix.key }}.exe"
          $bin = "target/${{ matrix.target }}/release/weeeking.exe"
          Compress-Archive -Path $bin -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$archive.sha256", "$hash  $archive`n")
          Copy-Item $bin $raw
          $rawHash = (Get-FileHash $raw -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$raw.sha256", "$rawHash  $raw`n")
          Add-Content -Path $env:GITHUB_ENV -Value "ARCHIVE=$archive"
          Add-Content -Path $env:GITHUB_ENV -Value "RAW=$raw"
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="weeeking-${VERSION}-${{ matrix.key }}.tar.gz"
          raw="weeeking-${VERSION}-${{ matrix.key }}"
          tar -czf "${archive}" -C "target/${{ matrix.target }}/release" weeeking
          sha256_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" > "$1.sha256"
            else
              shasum -a 256 "$1" > "$1.sha256"
            fi
          }
          sha256_file "${archive}"
          cp "target/${{ matrix.target }}/release/weeeking" "${raw}"
          chmod +x "${raw}"
          sha256_file "${raw}"
          {
            echo "ARCHIVE=${archive}"
            echo "RAW=${raw}"
          } >> "$GITHUB_ENV"
      - name: Collect release files
        id: files
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ARCHIVE:-}" ] || [ -z "${RAW:-}" ]; then
            echo "ARCHIVE/RAW are not set"; exit 1
          fi
          {
            echo "list<<EOF"
            echo "${ARCHIVE}"
            echo "${ARCHIVE}.sha256"
            echo "${RAW}"
            echo "${RAW}.sha256"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # actions/upload-artifact@v7.0.2 (запиннено по SHA)
      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.key }}
          path: ${{ steps.files.outputs.list }}
          if-no-files-found: error

  # Публикация «всё или ничего»: леги выше ничего не пишут в GitHub Releases — они собирают
  # файлы и отдают их workflow-артефактами. Один job скачивает полный набор и проверяет состав
  # и sha256; если релиз уже полон — чистый no-op, иначе создаёт ЧЕРНОВИК, подписывает файлы
  # GitHub-аттестациями (Sigstore), заливает в него все ассеты и публикует его отдельным
  # действием: публично релиз появляется только целиком. При сбое недосозданный черновик
  # удаляется (плюс страховочный шаг if: always()), конкурентные прогоны сериализуются.
  publish-release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # OIDC для GitHub-аттестаций (Sigstore)
      attestations: write # запись аттестаций в GitHub
    concurrency:
      group: publish-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      # gh не должен писать посторонние сообщения (update-notifier и т.п.):
      # состояние релиза парсится из stdout API-вызовов.
      GH_NO_UPDATE_NOTIFIER: "1"
      NO_COLOR: "1"
    steps:
      # actions/checkout@v7.0.1 (запиннено по SHA)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/download-artifact@v8.0.2 (запиннено по SHA)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: "*"
          merge-multiple: true
          path: dist
      - name: Verify the complete asset set
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match v${version}"; exit 1
          fi
          expected=""
          add() { expected="${expected}$1"$'\n'; }
          add "weeeking-${version}-win-x64.zip"
          add "weeeking-${version}-win-x64.zip.sha256"
          add "weeeking-${version}-win-x64.exe"
          add "weeeking-${version}-win-x64.exe.sha256"
          add "weeeking-${version}-win-arm64.zip"
          add "weeeking-${version}-win-arm64.zip.sha256"
          add "weeeking-${version}-win-arm64.exe"
          add "weeeking-${version}-win-arm64.exe.sha256"
          for key in linux-x64 linux-musl-x64 linux-arm64 osx-arm64 osx-x64; do
            add "weeeking-${version}-${key}.tar.gz"
            add "weeeking-${version}-${key}.tar.gz.sha256"
            add "weeeking-${version}-${key}"
            add "weeeking-${version}-${key}.sha256"
          done
          failed=0
          for name in ${expected}; do
            if [ ! -f "dist/${name}" ]; then echo "missing asset: ${name}"; failed=1; fi
          done
          expected_count=$(printf '%s' "${expected}" | grep -c .)
          count=$(find dist -maxdepth 1 -type f | wc -l)
          if [ "${count}" -ne "${expected_count}" ]; then echo "expected ${expected_count} files, got ${count}"; failed=1; fi
          if [ "${failed}" -ne 0 ]; then echo "asset verification failed"; exit 1; fi
          for f in dist/*; do
            case "$f" in *.sha256) continue;; esac
            want=$(cut -d' ' -f1 < "${f}.sha256")
            got=$(sha256sum "$f" | cut -d' ' -f1)
            if [ "${want}" != "${got}" ]; then echo "sha256 mismatch: ${f}"; failed=1; fi
          done
          if [ "${failed}" -ne 0 ]; then echo "asset verification failed"; exit 1; fi
          printf '%s' "${expected}" > expected_names.txt
          echo "all ${expected_count} assets verified"
      - name: Build the release body (description + SHA256 section)
        shell: bash
        run: |
          set -euo pipefail
          {
            echo
            echo "### SHA256 Hashes of the release artifacts"
            echo
            for f in $(cd dist && ls -1 | sort); do
              case "$f" in *.sha256) continue;; esac
              echo "- \`$f\` — \`$(sha256sum "dist/$f" | cut -d' ' -f1)\`"
            done
            echo
            echo "Суммы продублированы в файлах \`.sha256\` рядом с каждым артефактом."
          } > hashes.md
          cat .github/release-body.md hashes.md > body.md
      - name: Prepare the release draft
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s expected_names.txt ]; then
            echo "expected_names.txt is missing; aborting"; exit 1
          fi
          want_names=$(LC_ALL=C sort expected_names.txt | paste -sd, -)
          # shellcheck source=.github/scripts/release-state.sh
          source .github/scripts/release-state.sh
          cleanup_incomplete() {
            local state="$1"
            case "${state}" in
              "missing") echo "nothing to clean up (release is absent)";;
              "ok false ${want_names}") echo "complete release left in place";;
              "error") echo "release state unknown; not touching anything";;
              *) echo "removing incomplete release (${state})"
                 gh release delete "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --yes || true;;
            esac
          }
          state=$(release_state)
          if [ "${state}" = "error" ]; then
            echo "cannot determine the release state; aborting"; exit 1
          fi
          if [ "${state}" = "ok false ${want_names}" ]; then
            echo "release ${GITHUB_REF_NAME} is already published with the complete asset set; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "${state}" != "missing" ]; then
            echo "existing release is not the expected complete set (${state}); recreating"
            gh release delete "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --yes
          fi
          if ! gh release create "${GITHUB_REF_NAME}" \
              -R "${GITHUB_REPOSITORY}" \
              --draft \
              --verify-tag \
              --title "${GITHUB_REF_NAME} Release of Weeeking" \
              --notes-file body.md; then
            echo "draft creation failed"
            cleanup_incomplete "$(release_state)"
            exit 1
          fi
      # actions/attest-build-provenance@v4.2.2 (запиннено по SHA)
      - name: Attest release artifacts
        # Только когда релиз действительно создаётся (повторный прогон полного релиза
        # не плодит дубли аттестаций и не падает из-за внешнего сервиса аттестаций).
        if: success() && steps.prepare.outputs.skip != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*
      - name: Upload assets and publish
        if: success() && steps.prepare.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s expected_names.txt ]; then
            echo "expected_names.txt is missing; aborting"; exit 1
          fi
          want_names=$(LC_ALL=C sort expected_names.txt | paste -sd, -)
          # shellcheck source=.github/scripts/release-state.sh
          source .github/scripts/release-state.sh
          cleanup_incomplete() {
            local state="$1"
            case "${state}" in
              "missing") echo "nothing to clean up (release is absent)";;
              "ok false ${want_names}") echo "complete release left in place";;
              "error") echo "release state unknown; not touching anything";;
              *) echo "removing incomplete release (${state})"
                 gh release delete "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --yes || true;;
            esac
          }
          if ! gh release upload "${GITHUB_REF_NAME}" dist/* -R "${GITHUB_REPOSITORY}"; then
            echo "asset upload failed"
            cleanup_incomplete "$(release_state)"
            exit 1
          fi
          if ! gh release edit "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --draft=false; then
            echo "publishing failed"
            cleanup_incomplete "$(release_state)"
            exit 1
          fi
          echo "release ${GITHUB_REF_NAME} published with the full asset set"
      - name: Cleanup after failure or cancellation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # На успехе это no-op (релиз полный и опубликованный). Убирает только черновик или
          # неполный релиз после сбоя, отмены или убийства раннера.
          if [ ! -s expected_names.txt ]; then
            echo "expected_names.txt is missing; not touching the release"; exit 0
          fi
          want_names=$(LC_ALL=C sort expected_names.txt | paste -sd, -)
          # shellcheck source=.github/scripts/release-state.sh
          source .github/scripts/release-state.sh
          state=$(release_state)
          case "${state}" in
            "missing"|"error") echo "nothing to clean up (${state})";;
            "ok false ${want_names}") echo "complete release left in place";;
            *) echo "removing leftover draft/partial release (${state})"
               gh release delete "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --yes || true;;
          esac
